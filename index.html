<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
    <title>Catálogo de Filmes</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; font-family:'Barlow',sans-serif; color:white; }

        .catalogo {
            display:flex; flex-direction:column; align-items:center; gap:16px;
            background:linear-gradient(180deg,#000 70%,transparent);
            padding:24px 20px 20px;
            border-bottom:2px solid #e50914;
            position:sticky; top:0; z-index:100; backdrop-filter:blur(10px);
        }
        .catalogo h2 {
            font-family:'Bebas Neue',cursive; font-size:2rem; letter-spacing:4px;
            color:#e50914; text-shadow:0 0 20px rgba(229,9,20,0.5);
        }
        .funcao { display:flex; gap:8px; width:100%; max-width:500px; }
        .funcao input {
            flex:1; padding:12px 16px; border:1px solid #333; outline:none;
            border-radius:6px; font-size:15px; background:#1a1a1a; color:white;
            font-family:'Barlow',sans-serif; transition:border-color 0.2s;
        }
        .funcao input:focus { border-color:#e50914; }
        .funcao input::placeholder { color:#666; }
        .funcao button {
            padding:12px 18px; border:none; background:#e50914; color:white;
            border-radius:6px; cursor:pointer; font-size:17px; transition:background 0.2s,transform 0.1s;
        }
        .funcao button:hover { background:#b8070f; transform:scale(1.04); }

        .container { padding:28px 20px; }
        .filmes { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:22px; }

        .card {
            background:#161616; border-radius:10px; overflow:hidden;
            transition:transform 0.25s,box-shadow 0.25s; cursor:pointer; position:relative;
        }
        .card:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 12px 30px rgba(229,9,20,0.25); }
        .card img { width:100%; height:300px; object-fit:cover; display:block; }
        .card-overlay {
            position:absolute; inset:0;
            background:linear-gradient(to top,rgba(0,0,0,0.95) 0%,transparent 55%);
            opacity:0; transition:opacity 0.3s; display:flex; align-items:flex-end; padding:14px;
        }
        .card:hover .card-overlay { opacity:1; }
        .play-btn-overlay {
            width:100%; padding:10px; background:#e50914; color:white; border:none;
            border-radius:6px; cursor:pointer; font-size:15px; font-family:'Barlow',sans-serif;
            font-weight:600; letter-spacing:1px; transition:background 0.2s;
        }
        .play-btn-overlay:hover { background:#b8070f; }
        .info { padding:12px; }
        .info h3 { margin-bottom:6px; color:#fff; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .info p { font-size:12px; color:#888; line-height:1.4; }
        .info button {
            width:100%; padding:9px; margin-top:10px; border:none; background:#e50914; color:white;
            border-radius:5px; cursor:pointer; font-size:14px; font-family:'Barlow',sans-serif;
            font-weight:600; letter-spacing:0.5px; transition:background 0.2s;
        }
        .info button:hover { background:#b8070f; }

        /* MODAL */
        .modal {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.92); display:none; justify-content:center;
            align-items:center; padding:20px; z-index:999;
        }
        .modal-content {
            background:#161616; width:100%; max-width:900px; border-radius:12px;
            overflow:hidden; position:relative; box-shadow:0 0 60px rgba(229,9,20,0.2);
            animation:slideUp 0.25s ease; max-height:90vh; overflow-y:auto;
        }
        @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }

        /* ABAS */
        .abas { display:flex; background:#111; border-bottom:2px solid #222; }
        .aba {
            flex:1; padding:12px; text-align:center; cursor:pointer;
            font-family:'Barlow',sans-serif; font-size:14px; font-weight:600;
            color:#555; border:none; background:transparent;
            transition:color 0.2s, border-bottom 0.2s;
            border-bottom:3px solid transparent; letter-spacing:0.5px;
        }
        .aba:hover { color:#aaa; }
        .aba.ativa { color:white; border-bottom:3px solid #e50914; }
        .aba.loading-aba { color:#e50914; }
        .aba.indisponivel { color:#333; cursor:default; }

        /* PLAYER */
        .player-wrapper {
            position:relative; width:100%; padding-top:56.25%; background:#000;
        }
        .player-wrapper iframe {
            position:absolute; top:0; left:0; width:100%; height:100%; border:none;
        }
        .player-placeholder {
            position:absolute; top:0; left:0; width:100%; height:100%;
            display:flex; flex-direction:column; justify-content:center;
            align-items:center; gap:12px; color:#666; font-size:14px; text-align:center; padding:20px;
        }
        .player-placeholder i { font-size:48px; color:#333; }

        .modal-info { padding:20px 24px; display:flex; flex-direction:column; gap:8px; }
        .modal-info h2 { font-family:'Bebas Neue',cursive; color:#e50914; font-size:1.8rem; letter-spacing:2px; }
        .modal-info p { font-size:14px; color:#bbb; line-height:1.6; }
        .modal-meta { display:flex; gap:16px; font-size:13px; color:#888; margin-top:4px; flex-wrap:wrap; }

        /* OMDB EXTRAS */
        .omdb-tags {
            display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;
        }
        .tag {
            padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;
            background:#222; color:#aaa; border:1px solid #333; letter-spacing:0.5px;
        }
        .omdb-row {
            display:flex; gap:6px; font-size:13px; color:#888; align-items:flex-start; flex-wrap:wrap;
        }
        .omdb-row span.label { color:#555; min-width:70px; }
        .omdb-row span.value { color:#ccc; flex:1; }
        .omdb-ratings { display:flex; gap:12px; margin-top:4px; flex-wrap:wrap; }
        .rating-badge {
            display:flex; flex-direction:column; align-items:center; background:#1f1f1f;
            border:1px solid #2a2a2a; border-radius:8px; padding:8px 14px; gap:2px;
        }
        .rating-badge .source { font-size:10px; color:#555; text-transform:uppercase; letter-spacing:1px; }
        .rating-badge .score { font-size:18px; font-weight:600; color:#e50914; }
        .omdb-loading { color:#555; font-size:13px; font-style:italic; }
        .omdb-error { color:#444; font-size:13px; }

        .modal-botoes { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
        .btn-externo {
            flex:1; min-width:120px; padding:10px; border:none; background:#222; color:#aaa;
            border-radius:6px; cursor:pointer; font-size:13px; font-family:'Barlow',sans-serif;
            font-weight:600; border:1px solid #333; transition:background 0.2s;
            display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;
        }
        .btn-externo:hover { background:#333; color:white; }
        .btn-imdb { background:#f5c518 !important; color:#000 !important; border-color:#f5c518 !important; }
        .btn-imdb:hover { background:#d4aa14 !important; }

        .fechar {
            position:absolute; top:12px; right:16px; font-size:28px; cursor:pointer; color:white;
            background:rgba(0,0,0,0.6); width:36px; height:36px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; z-index:10;
            transition:background 0.2s; line-height:1;
        }
        .fechar:hover { background:#e50914; }

        .loading { text-align:center; padding:60px 20px; color:#555; font-size:16px; }
        .loading i { font-size:40px; display:block; margin-bottom:12px; animation:spin 1s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .nao-encontrado { grid-column:1/-1; text-align:center; padding:60px; color:#555; }
    </style>
</head>
<body>

<nav class="catalogo">
    <h2>🎬 Filmes &amp; Séries</h2>
    <div class="funcao">
        <input type="text" id="pesquisa" placeholder="Pesquisar filme ou série...">
        <button onclick="pesquisarFilme()"><i class="bi bi-search"></i></button>
    </div>
</nav>

<div class="container">
    <div class="filmes" id="filmes">
        <div class="loading" style="grid-column:1/-1">
            <i class="bi bi-arrow-repeat"></i>Carregando filmes...
        </div>
    </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="fechar" onclick="fecharModal()">&times;</span>

        <!-- ABAS -->
        <div class="abas">
            <button class="aba ativa" id="aba-filme" onclick="trocarAba('filme')">🎬 Filme Completo</button>
            <button class="aba" id="aba-trailer" onclick="trocarAba('trailer')">▶ Trailer</button>
        </div>

        <!-- PLAYER -->
        <div class="player-wrapper" id="player-wrapper">
            <div class="player-placeholder" id="player-placeholder">
                <i class="bi bi-play-circle"></i>
                <span>Carregando...</span>
            </div>
        </div>

        <div class="modal-info">
            <h2 id="modal-titulo"></h2>
            <p id="modal-descricao"></p>

            <div class="modal-meta">
                <div>⭐ <span id="modal-nota"></span></div>
                <div>📅 <span id="modal-data"></span></div>
                <div id="modal-runtime" style="display:none">🕐 <span id="modal-runtime-val"></span></div>
                <div id="modal-rated" style="display:none">🔞 <span id="modal-rated-val"></span></div>
            </div>

            <!-- Tags de gênero (OMDb) -->
            <div class="omdb-tags" id="modal-genres"></div>

            <!-- Detalhes OMDb -->
            <div id="omdb-section" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
                <div class="omdb-loading" id="omdb-loading">⏳ Buscando informações adicionais...</div>
                <div id="omdb-director" class="omdb-row" style="display:none">
                    <span class="label">🎬 Diretor</span><span class="value" id="omdb-director-val"></span>
                </div>
                <div id="omdb-cast" class="omdb-row" style="display:none">
                    <span class="label">🎭 Elenco</span><span class="value" id="omdb-cast-val"></span>
                </div>
                <div id="omdb-awards" class="omdb-row" style="display:none">
                    <span class="label">🏆 Prêmios</span><span class="value" id="omdb-awards-val"></span>
                </div>
                <div id="omdb-boxoffice" class="omdb-row" style="display:none">
                    <span class="label">💰 Bilheteria</span><span class="value" id="omdb-boxoffice-val"></span>
                </div>
            </div>

            <!-- Notas OMDb -->
            <div class="omdb-ratings" id="omdb-ratings"></div>

            <div class="modal-botoes">
                <a id="btn-externo" class="btn-externo" target="_blank" rel="noopener">
                    <i class="bi bi-youtube"></i> YouTube
                </a>
                <a id="btn-imdb" class="btn-externo btn-imdb" target="_blank" rel="noopener" style="display:none">
                    IMDb
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const tmdbKey  = "d27c005ce0817bf0169ff28de020eb67";
    const omdbKey  = "6ae87b45";
    const filmesContainer = document.getElementById("filmes");

    let idFilme   = null;
    let idTrailer = null;
    let abaAtiva  = "filme";

    const ytKey = "AIzaSyAsS6_YDqVnTnDx1Btn6TatPcKbhgCw9vY";

    // ── TMDB ──────────────────────────────────────
    async function buscarFilmes() {
        const url = `https://api.themoviedb.org/3/movie/popular?api_key=${tmdbKey}&language=pt-BR&page=1`;
        try {
            const r = await fetch(url);
            const d = await r.json();
            mostrarFilmes(d.results);
        } catch(e) {
            filmesContainer.innerHTML = `<div class="nao-encontrado">Erro ao carregar filmes.</div>`;
        }
    }

    async function pesquisarFilme() {
        const texto = document.getElementById("pesquisa").value.trim();
        if (texto === "") { buscarFilmes(); return; }
        filmesContainer.innerHTML = `<div class="loading" style="grid-column:1/-1"><i class="bi bi-arrow-repeat"></i>Buscando...</div>`;
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&language=pt-BR&query=${encodeURIComponent(texto)}`;
        try {
            const r = await fetch(url);
            const d = await r.json();
            mostrarFilmes(d.results);
        } catch(e) {
            filmesContainer.innerHTML = `<div class="nao-encontrado">Erro na pesquisa.</div>`;
        }
    }

    function mostrarFilmes(filmes) {
        filmesContainer.innerHTML = "";
        if (!filmes || filmes.length === 0) {
            filmesContainer.innerHTML = `<div class="nao-encontrado"><i class="bi bi-film" style="font-size:48px;display:block;margin-bottom:12px;"></i>Nenhum filme encontrado.</div>`;
            return;
        }
        filmes.forEach(filme => {
            const imagem = filme.poster_path
                ? `https://image.tmdb.org/t/p/w500${filme.poster_path}`
                : `https://via.placeholder.com/500x750?text=Sem+Imagem`;
            const resumo = filme.overview ? filme.overview.substring(0,90)+"..." : "Sem descrição.";
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.id        = filme.id;
            card.dataset.titulo    = filme.title;
            card.dataset.tituloEn  = filme.original_title || filme.title;
            card.dataset.descricao = filme.overview || "Sem descrição.";
            card.dataset.nota      = filme.vote_average ? filme.vote_average.toFixed(1) : "N/A";
            card.dataset.data      = filme.release_date || "Desconhecido";
            card.dataset.ano       = filme.release_date ? filme.release_date.substring(0,4) : "";
            card.innerHTML = `
                <img src="${imagem}" alt="${filme.title}" loading="lazy">
                <div class="card-overlay">
                    <button class="play-btn-overlay" onclick="abrirPlayer(${filme.id},event)">▶ Assistir</button>
                </div>
                <div class="info">
                    <h3>${filme.title}</h3>
                    <p>${resumo}</p>
                    <button onclick="abrirPlayer(${filme.id},event)">▶ Assistir</button>
                </div>
            `;
            card.addEventListener("click", () => abrirPlayer(filme.id));
            filmesContainer.appendChild(card);
        });
    }

    // ── OMDB ──────────────────────────────────────
    async function buscarOmdb(titulo, ano) {
        try {
            // Busca por título (e ano se disponível)
            let url = `https://www.omdbapi.com/?t=${encodeURIComponent(titulo)}&apikey=${omdbKey}&type=movie`;
            if (ano) url += `&y=${ano}`;
            const r = await fetch(url);
            const d = await r.json();
            if (d.Response === "True") return d;

            // Fallback: só título sem ano
            if (ano) {
                const url2 = `https://www.omdbapi.com/?t=${encodeURIComponent(titulo)}&apikey=${omdbKey}&type=movie`;
                const r2 = await fetch(url2);
                const d2 = await r2.json();
                if (d2.Response === "True") return d2;
            }

            return null;
        } catch(e) { return null; }
    }

    function renderizarOmdb(data) {
        document.getElementById("omdb-loading").style.display = "none";

        if (!data) {
            document.getElementById("omdb-loading").textContent = "";
            return;
        }

        // Runtime
        if (data.Runtime && data.Runtime !== "N/A") {
            document.getElementById("modal-runtime").style.display = "";
            document.getElementById("modal-runtime-val").textContent = data.Runtime;
        }

        // Classificação etária
        if (data.Rated && data.Rated !== "N/A") {
            document.getElementById("modal-rated").style.display = "";
            document.getElementById("modal-rated-val").textContent = data.Rated;
        }

        // Gêneros como tags
        if (data.Genre && data.Genre !== "N/A") {
            const container = document.getElementById("modal-genres");
            data.Genre.split(",").forEach(g => {
                const tag = document.createElement("span");
                tag.className = "tag";
                tag.textContent = g.trim();
                container.appendChild(tag);
            });
        }

        // Diretor
        if (data.Director && data.Director !== "N/A") {
            document.getElementById("omdb-director").style.display = "flex";
            document.getElementById("omdb-director-val").textContent = data.Director;
        }

        // Elenco
        if (data.Actors && data.Actors !== "N/A") {
            document.getElementById("omdb-cast").style.display = "flex";
            document.getElementById("omdb-cast-val").textContent = data.Actors;
        }

        // Prêmios
        if (data.Awards && data.Awards !== "N/A" && data.Awards !== "N/A.") {
            document.getElementById("omdb-awards").style.display = "flex";
            document.getElementById("omdb-awards-val").textContent = data.Awards;
        }

        // Bilheteria
        if (data.BoxOffice && data.BoxOffice !== "N/A") {
            document.getElementById("omdb-boxoffice").style.display = "flex";
            document.getElementById("omdb-boxoffice-val").textContent = data.BoxOffice;
        }

        // Ratings (IMDb, Rotten Tomatoes, Metacritic)
        const ratingsContainer = document.getElementById("omdb-ratings");
        const sourceMap = { "Internet Movie Database":"IMDb", "Rotten Tomatoes":"Rotten", "Metacritic":"Meta" };
        if (data.Ratings && data.Ratings.length > 0) {
            data.Ratings.forEach(r => {
                const badge = document.createElement("div");
                badge.className = "rating-badge";
                const src = sourceMap[r.Source] || r.Source;
                badge.innerHTML = `<span class="source">${src}</span><span class="score">${r.Value}</span>`;
                ratingsContainer.appendChild(badge);
            });
        }

        // Botão IMDb
        if (data.imdbID) {
            const btnImdb = document.getElementById("btn-imdb");
            btnImdb.href = `https://www.imdb.com/title/${data.imdbID}/`;
            btnImdb.style.display = "flex";
        }
    }

    // ── YOUTUBE DATA API v3: busca filme completo ─
    async function buscarFilmeYT(titulo, tituloEn) {
        const queries = [
            `${titulo} filme completo dublado`,
            `${tituloEn || titulo} full movie free`,
            `${titulo} filme completo`,
            `${tituloEn || titulo} full movie`
        ];

        for (const q of queries) {
            try {
                // 1ª etapa: busca os candidatos
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(q)}&videoEmbeddable=true&videoDuration=long&maxResults=10&key=${ytKey}`;
                const r = await fetch(searchUrl);
                if (!r.ok) continue;
                const data = await r.json();
                if (!data.items || data.items.length === 0) continue;

                const ids = data.items.map(i => i.id.videoId).join(",");

                // 2ª etapa: verifica duração real (>= 60 min)
                const detailUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,status&id=${ids}&key=${ytKey}`;
                const r2 = await fetch(detailUrl);
                if (!r2.ok) continue;
                const detail = await r2.json();

                for (const item of detail.items) {
                    // Só vídeos incorporáveis
                    if (!item.status.embeddable) continue;

                    // Converte duração ISO 8601 (PT1H23M45S) para segundos
                    const dur = item.contentDetails.duration;
                    const match = dur.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
                    if (!match) continue;
                    const h = parseInt(match[1] || 0);
                    const m = parseInt(match[2] || 0);
                    const s = parseInt(match[3] || 0);
                    const totalSeg = h * 3600 + m * 60 + s;

                    if (totalSeg >= 3600) return item.id; // filme encontrado!
                }
            } catch(e) { continue; }
        }
        return false;
    }

    // ── TMDB: busca trailer ───────────────────────
    async function buscarTrailerTMDB(id) {
        const urls = [
            `https://api.themoviedb.org/3/movie/${id}/videos?api_key=${tmdbKey}&language=pt-BR`,
            `https://api.themoviedb.org/3/movie/${id}/videos?api_key=${tmdbKey}&language=en-US`
        ];
        for (const url of urls) {
            try {
                const r = await fetch(url);
                const d = await r.json();
                const t = d.results.find(v => v.type === "Trailer" && v.site === "YouTube");
                if (t) return t.key;
            } catch(e) {}
        }
        return false;
    }

    // ── ABRIR PLAYER ──────────────────────────────
    async function abrirPlayer(id, event) {
        if (event) event.stopPropagation();

        const card = document.querySelector(`.card[data-id="${id}"]`);
        const titulo    = card ? card.dataset.titulo    : "";
        const tituloEn  = card ? card.dataset.tituloEn  : titulo;
        const descricao = card ? card.dataset.descricao : "";
        const nota      = card ? card.dataset.nota      : "";
        const data      = card ? card.dataset.data      : "";
        const ano       = card ? card.dataset.ano       : "";

        // Reset estado
        idFilme = null; idTrailer = null; abaAtiva = "filme";

        // Abre modal
        document.getElementById("modal").style.display = "flex";
        document.getElementById("modal-titulo").innerText    = titulo;
        document.getElementById("modal-descricao").innerText = descricao;
        document.getElementById("modal-nota").innerText      = nota;
        document.getElementById("modal-data").innerText      = data;

        // Reset campos OMDb
        document.getElementById("modal-runtime").style.display = "none";
        document.getElementById("modal-rated").style.display = "none";
        document.getElementById("modal-genres").innerHTML = "";
        document.getElementById("omdb-loading").style.display = "";
        document.getElementById("omdb-loading").textContent = "⏳ Buscando informações adicionais...";
        document.getElementById("omdb-director").style.display = "none";
        document.getElementById("omdb-cast").style.display = "none";
        document.getElementById("omdb-awards").style.display = "none";
        document.getElementById("omdb-boxoffice").style.display = "none";
        document.getElementById("omdb-ratings").innerHTML = "";
        document.getElementById("btn-imdb").style.display = "none";

        // Abas loading
        const abaFilme   = document.getElementById("aba-filme");
        const abaTrailer = document.getElementById("aba-trailer");
        abaFilme.className   = "aba ativa loading-aba";
        abaFilme.textContent = "⏳ Buscando filme...";
        abaTrailer.className   = "aba loading-aba";
        abaTrailer.textContent = "⏳ Buscando trailer...";

        document.getElementById("btn-externo").href =
            `https://www.youtube.com/results?search_query=${encodeURIComponent(titulo+" filme completo dublado")}`;

        setIframe(null);
        showPlaceholder(`<i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;font-size:40px;color:#e50914"></i><span>Buscando filme completo no YouTube...</span>`);

        // Busca OMDb em paralelo
        buscarOmdb(tituloEn, ano).then(omdbData => renderizarOmdb(omdbData));

        buscarFilmeYT(titulo, tituloEn).then(videoId => {
            idFilme = videoId;
            abaFilme.className   = videoId ? "aba ativa" : "aba indisponivel";
            abaFilme.textContent = videoId ? "🎬 Filme Completo" : "🎬 Não disponível";
            if (abaAtiva === "filme") renderAba();
        });

        buscarTrailerTMDB(id).then(videoId => {
            idTrailer = videoId;
            abaTrailer.className   = videoId ? "aba" : "aba indisponivel";
            abaTrailer.textContent = videoId ? "▶ Trailer" : "▶ Sem trailer";
            if (abaAtiva === "filme" && idFilme === null && videoId) {
                showPlaceholder(`<i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;font-size:40px;color:#e50914"></i><span>Buscando filme completo... (trailer disponível na aba acima)</span>`);
            }
        });
    }

    // ── TROCAR ABA ────────────────────────────────
    function trocarAba(aba) {
        const abaFilmeEl   = document.getElementById("aba-filme");
        const abaTrailerEl = document.getElementById("aba-trailer");
        if (aba === "filme"   && abaFilmeEl.classList.contains("indisponivel")) return;
        if (aba === "trailer" && abaTrailerEl.classList.contains("indisponivel")) return;
        abaAtiva = aba;
        abaFilmeEl.classList.toggle("ativa",   aba === "filme");
        abaTrailerEl.classList.toggle("ativa", aba === "trailer");
        renderAba();
    }

    function renderAba() {
        if (abaAtiva === "filme") {
            if (idFilme === null) {
                showPlaceholder(`<i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;font-size:40px;color:#e50914"></i><span>Buscando filme completo no YouTube...</span>`);
            } else if (idFilme === false) {
                showPlaceholder(`
                    <i class="bi bi-film" style="font-size:40px;color:#333"></i>
                    <span>Filme completo não encontrado no YouTube.</span>
                    <a href="${document.getElementById("btn-externo").href}" target="_blank"
                       style="color:#e50914;margin-top:8px;font-size:13px;">Buscar manualmente →</a>
                `);
            } else {
                document.getElementById("btn-externo").href = `https://www.youtube.com/watch?v=${idFilme}`;
                setIframe(idFilme);
            }
        } else {
            if (idTrailer === null) {
                showPlaceholder(`<i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;font-size:40px;color:#e50914"></i><span>Buscando trailer...</span>`);
            } else if (idTrailer === false) {
                showPlaceholder(`<i class="bi bi-exclamation-circle" style="font-size:40px;color:#333"></i><span>Trailer não encontrado.</span>`);
            } else {
                document.getElementById("btn-externo").href = `https://www.youtube.com/watch?v=${idTrailer}`;
                setIframe(idTrailer);
            }
        }
    }

    function setIframe(videoId) {
        const wrapper = document.getElementById("player-wrapper");
        const old = wrapper.querySelector("iframe");
        if (old) old.remove();
        document.getElementById("player-placeholder").style.display = "none";
        if (!videoId) return;
        const iframe = document.createElement("iframe");
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.allowFullscreen = true;
        wrapper.appendChild(iframe);
    }

    function showPlaceholder(html) {
        const wrapper = document.getElementById("player-wrapper");
        const old = wrapper.querySelector("iframe");
        if (old) old.remove();
        const ph = document.getElementById("player-placeholder");
        ph.style.display = "flex";
        ph.innerHTML = html;
    }

    // ── FECHAR ────────────────────────────────────
    function fecharModal() {
        document.getElementById("modal").style.display = "none";
        const iframe = document.getElementById("player-wrapper").querySelector("iframe");
        if (iframe) iframe.remove();
        idFilme = null; idTrailer = null;
    }

    document.getElementById("modal").addEventListener("click", function(e) {
        if (e.target === this) fecharModal();
    });

    document.getElementById("pesquisa").addEventListener("keypress", function(e) {
        if (e.key === "Enter") pesquisarFilme();
    });

    buscarFilmes();
</script>
</body>
</html>
